name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      use_untrained_model:
        description: "Evaluate the UNTRAINED Pythia-70M (to demonstrate the quality gate failing)"
        type: boolean
        default: false
      release_tag:
        description: "GitHub Release that holds model-v1.tar.gz"
        default: "v1.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.6.9
      - run: ruff check .

  secret-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (must report nothing)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pytest==8.3.3 fastapi==0.115.0 httpx==0.27.2 pydantic==2.9.2 boto3==1.35.36 PyYAML==6.0.2
      - run: python -m pytest -q tests

  evaluate-model:
    runs-on: ubuntu-latest
    needs: [unit-tests, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: install CPU PyTorch + transformers
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu transformers==4.46.3 numpy==1.26.4
      - name: download trained model from the GitHub Release
        if: ${{ !inputs.use_untrained_model }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="${{ inputs.release_tag || 'v1.0' }}"
          mkdir -p models/v1
          gh release download "$TAG" -p 'model-v1.tar.gz' -p 'model-v1.sha256' -D /tmp/rel
          (cd /tmp/rel && sha256sum -c model-v1.sha256)
          tar -xzf /tmp/rel/model-v1.tar.gz -C models/v1
      - name: predict on validation.jsonl
        run: |
          mkdir -p results
          if [ "${{ inputs.use_untrained_model }}" = "true" ]; then
            python scripts/predict.py base --out results/ci_predictions.jsonl
          else
            python scripts/predict.py student --model models/v1 --out results/ci_predictions.jsonl
          fi
      - name: score (report only)
        run: python tools/score.py results/ci_predictions.jsonl data/validation.jsonl --out results/ci_report.json
      - uses: actions/upload-artifact@v4
        with: {name: eval-outputs, path: results/ci_*}

  quality-gate:
    runs-on: ubuntu-latest
    needs: evaluate-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: eval-outputs, path: results}
      - name: gate - JSON validity must be >= 95 %
        run: python tools/score.py results/ci_predictions.jsonl data/validation.jsonl --min-validity 95
