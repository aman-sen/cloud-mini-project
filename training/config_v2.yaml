# All training hyper-parameters live here; `make train` reads only this file.
base_model: EleutherAI/pythia-70m
version: v2
seed: 7
learning_rate: 0.0003
batch_size: 8
epochs: 8
max_seq_len: 96          # tokens of "Command: ...\nJSON: ...<eos>"; longer examples are truncated
weight_decay: 0.01
warmup_ratio: 0.05
train_file: data/train.jsonl   # first 1,500 records of the cleaned dataset are used
max_examples: 1500
output_dir: models/v2
loss_csv: training/loss_v2.csv
library_versions:
  python: "3.11"
  torch: "2.5.1"
  transformers: "4.46.3"
  numpy: "1.26.4"
  pyyaml: "6.0.2"
