apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: cloudlab
servers: 1
agents: 0
ports:
  - port: 8080:80          # host:8080 -> Traefik ingress (the load test uses http://localhost:8080)
    nodeFilters: [loadbalancer]
  - port: 8333:30333       # host:8333 -> SeaweedFS S3 NodePort (for scripts run on the host)
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs: []
