# Object storage (S3-compatible) in namespace `data`. Credentials: Secrets created by
# scripts/gen_secrets.sh (nothing secret is stored in the repository).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-volume.max=30", "-filer", "-s3", "-s3.port=8333",
                 "-s3.config=/etc/seaweedfs/s3.json"]
          ports: [{containerPort: 8333, name: s3}]
          readinessProbe: {tcpSocket: {port: 8333}, initialDelaySeconds: 5, periodSeconds: 5}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3config
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs-s3, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports: [{name: s3, port: 8333, targetPort: 8333}]
---
# NodePort so that scripts on the laptop can reach S3 at localhost:8333 (see cluster/k3d.yaml).
apiVersion: v1
kind: Service
metadata: {name: seaweedfs-s3-nodeport, namespace: data}
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports: [{name: s3, port: 8333, targetPort: 8333, nodePort: 30333}]
