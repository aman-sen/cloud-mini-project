# Two parallel teacher-labelling workers (Indexed Job: completions=parallelism=2).
# SHARD_INDEX comes from the Job completion index; SHARD_COUNT=2.
# The teacher (Ollama, phi3.5) runs on the laptop; run `OLLAMA_HOST=0.0.0.0 ollama serve`.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-labelling, namespace: pipeline}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloudlab-worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://host.docker.internal:11434"}
            - {name: TEACHER_MODEL, value: "phi3.5"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
